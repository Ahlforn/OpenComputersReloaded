pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

// Foojay toolchain resolver — allows Gradle to automatically download a
// matching JDK (Java 25) when the system does not have it installed.
// NeoForge 26.1 / MC 26.1 requires Java 25.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "opencomputers"
