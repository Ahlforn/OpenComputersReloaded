plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'com.modrinth.minotaur' version '2.8.7'
}

// ---------------------------------------------------------------------------
// Version assembly: <mod_version>[-<date>]+<git-sha>
// ---------------------------------------------------------------------------

def getGitRef() {
    try {
        return ['git', 'rev-parse', '--short', 'HEAD'].execute(null, rootDir).text.trim()
    } catch (Throwable ignored) {
        return 'unknown'
    }
}

version = "${mod_version}"
if (version.endsWith('-snapshot')) {
    version += '-' + new Date().format('yyyyMMdd')
}
version += '+' + getGitRef()

ext.simpleVersion = version   // version without the MC prefix
group = 'li.cil.oc'

// ---------------------------------------------------------------------------
// Java toolchain
//
// The intermediate migration target (NeoForge 21.4.x / MC 1.21.4) requires
// Java 21 at runtime, but we compile with whatever JDK is available (Java 25
// on this machine) and set the release flag to 21 so the output class files
// are compatible with Java 21+ runtimes.
//
// Once Phase 11 (NeoForge 26.1 / MC 26.1) lands, the release flag can be
// relaxed to 25.
//
// If you have Java 21 installed and want to use it for stricter compatibility
// checking, add this to gradle.properties:
//   org.gradle.java.home=/path/to/jdk21
// ---------------------------------------------------------------------------

// NeoForge 1.21.4 internally needs Java 21 for artifact-processing tasks.
// The Foojay resolver in settings.gradle provisions it automatically if not
// present.  Our source is compiled with whatever JDK is available and the
// bytecode is targeted at Java 21 for runtime compatibility.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Explicit release flag keeps bytecode compatible with Java 21 even when
    // compiled by a newer JDK.  Phase 11 bumps this to 25.
    options.release = 21
}

// ---------------------------------------------------------------------------
// NeoForge / ModDevGradle
// ---------------------------------------------------------------------------

neoForge {
    version = "${neoforge_version}"

    // Access transformer — populated phase by phase as Mojmap names are identified.
    // Must be non-empty for NeoForge to pick it up; even a comment-only file is fine.
    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        opencomputers {
            sourceSet(sourceSets.main)
        }
    }
}

// ---------------------------------------------------------------------------
// Source sets
//
// Strategy during the Java port:
//  - src/main/java  — only new NeoForge-compatible Java files.
//    The legacy li.cil.oc.api.** and asm/**, integration/**, and the
//    Forge-coupled util helpers are EXCLUDED until their respective phases.
//  - src/main/scala — NOT compiled (Scala plugin removed).
//    Files remain on disk as authoritative porting reference.
//  - src/main/resources — all resources compiled as-is; legacy mcmod.info
//    is harmlessly ignored by NeoForge.
//
// Re-enable each exclusion group once the corresponding phase lands:
//   api/**         → Phase 10 (Public API revision)
//   common/asm/**  → Phase 9  (SimpleComponent redesign)
//   integration/** → post-core milestone
//   util/OCObfuscationReflectionHelper.java → drop (SRG gone)
//   util/SideTracker.java → Phase 1 (replace with Dist-aware util)
// ---------------------------------------------------------------------------

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            exclude 'li/cil/oc/api/**'
            exclude 'li/cil/oc/common/asm/**'
            exclude 'li/cil/oc/integration/**'
            exclude 'li/cil/oc/util/OCObfuscationReflectionHelper.java'
            exclude 'li/cil/oc/util/SideTracker.java'
            exclude 'com/typesafe/config/impl/OpenComputersConfigCommentManipulationHook.java'
        }
    }
}

// ---------------------------------------------------------------------------
// Repositories
// ---------------------------------------------------------------------------

repositories {
    maven {
        name 'MightyPirates'
        url 'https://maven.cil.li/'
        content {
            // OC-LuaJ, OC-JNLua are published here.
            // These artifact IDs may need updating for new builds targeting Java 21+.
            includeGroupByRegex 'li\\.cil\\..*'
        }
    }
    // asie.pl ivy mirror for legacy OC embedded deps (OC-LuaJ-Natives, etc.)
    ivy {
        name 'asie dependency mirror'
        url 'https://asie.pl/javadeps/'
        patternLayout {
            artifact '[module]-[revision](-[classifier]).[ext]'
        }
        metadataSources {
            artifact()
        }
        content {
            includeModuleByRegex '.*', 'OC-.*'
        }
    }
}

// ---------------------------------------------------------------------------
// Dependencies
// ---------------------------------------------------------------------------

dependencies {
    // ------------------------------------------------------------------
    // Typesafe Config — used by Settings.java for the OC configuration
    // system.  Must be shaded/jar-in-jar because modern Minecraft does
    // not ship it.
    // ------------------------------------------------------------------
    // TODO Phase 1: decide whether to shade via Shadow plugin or use
    // NeoForge jarJar here.  For now it's compile-only until shading is
    // set up, meaning it will be missing at runtime (config will not
    // load yet).
    compileOnly 'com.typesafe:config:1.4.3'

    // ------------------------------------------------------------------
    // OC-LuaJ — pure-JVM Lua runtime (the only Lua backend for the
    // minimal-core milestone; JNLua/native backend deferred).
    //
    // TODO Phase 1: verify OC-LuaJ-20220907.1 runs on Java 21 (it was
    // compiled for Java 8, so class-file compatibility should hold).
    // If the ivy URL is unreachable, download the jar and place it at
    // libs/OC-LuaJ-20220907.1.jar, then replace with:
    //   jarJar(files('libs/OC-LuaJ-20220907.1.jar'))
    // ------------------------------------------------------------------
    // jarJar(name: 'OC-LuaJ', version: '20220907.1', ext: 'jar') { ... }

    // ------------------------------------------------------------------
    // Tests
    // ------------------------------------------------------------------
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// Process resources — expand variables in neoforge.mods.toml and application.conf
// ---------------------------------------------------------------------------

processResources {
    def modVer  = "${mod_version}"
    def mcVer   = "${minecraft_version}"
    def nfVer   = "${neoforge_version}"
    inputs.property 'mod_version',       modVer
    inputs.property 'minecraft_version', mcVer
    inputs.property 'neoforge_version',  nfVer

    // neoforge.mods.toml uses ${mod_version} / ${minecraft_version} / ${neoforge_version}
    // Groovy expand() is safe here because the toml contains no other ${} references.
    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            mod_version       : modVer,
            minecraft_version : mcVer,
            neoforge_version  : nfVer,
        ])
    }

    // application.conf uses the legacy @VERSION@ token AND contains Typesafe Config
    // ${?...} substitution syntax throughout — do NOT use expand() on it (it would
    // corrupt every config substitution reference).  Simple line filter only.
    filesMatching('application.conf') {
        filter { line -> line.replace('@VERSION@', modVer) }
    }
}

// ---------------------------------------------------------------------------
// Jar manifest
// ---------------------------------------------------------------------------

jar {
    manifest {
        attributes(
            'Specification-Title'   : 'opencomputers',
            'Specification-Vendor'  : 'Ahlforn',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': "${mod_version}",
            'Implementation-Vendor' : 'Ahlforn',
        )
    }
}

// ---------------------------------------------------------------------------
// Tests
// ---------------------------------------------------------------------------

test {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// API artifact (li/cil/oc/api/** only)
// Published separately so addon authors can depend on only the API surface.
// Re-enable once Phase 10 (Public API revision) lands.
// ---------------------------------------------------------------------------

// task apiJar(type: Jar) {
//     from sourceSets.main.allSource
//     from sourceSets.main.output
//     archiveClassifier = 'api'
//     include 'li/cil/oc/api/**'
//     dependsOn compileJava
// }
// artifacts { archives apiJar }

// ---------------------------------------------------------------------------
// Publishing
// ---------------------------------------------------------------------------

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = mod_version
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = System.getenv('GITHUB_MAVEN_URL') ?: 'file://${project.buildDir}/local-repo'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

