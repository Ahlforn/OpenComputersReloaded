modLoader = "javafml"
# NeoForge FML loader version — 4.x covers NeoForge 26.1 (MC 26.1 / Java 25).
loaderVersion = "[4,)"

license = "MIT"

[[mods]]
    modId = "opencomputers"
    version = "${mod_version}"
    displayName = "OpenComputers"
    logoFile = "assets/opencomputers/textures/gui/logo.png"
    description = '''
        OpenComputers adds modular computers and robots that can be programmed
        in Lua. Computers and robots persist across chunk unloads and can
        interact with the world through a variety of hardware components.
    '''

    authors = "Sangar, Vexatos, payonel, magik6k, Lord Joda, Ahlforn, GitHub Contributors"
    displayURL = "https://github.com/Ahlforn/OpenComputersReloaded"
    credits = "Inspired by ComputerCraft and others."

    # --- Update checker (optional) ---
    # updateJSONURL = ""

[[dependencies.opencomputers]]
    modId = "neoforge"
    type = "required"
    # Require NeoForge 26.1.x or newer.
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.opencomputers]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version},)"
    ordering = "NONE"
    side = "BOTH"
